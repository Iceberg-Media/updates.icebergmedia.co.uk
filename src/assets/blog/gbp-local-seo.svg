<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1729;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#141b2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1320;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="rounded"><rect width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Glowing orb background -->
  <circle cx="600" cy="315" r="250" fill="#3b82f6" opacity="0.05" filter="url(#glow)"/>
  <circle cx="800" cy="200" r="150" fill="#60a5fa" opacity="0.03" filter="url(#glow)"/>

  <!-- Main card -->
  <rect x="60" y="40" width="1080" height="550" rx="16" fill="url(#card)" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>

  <!-- Left side: GBP/Maps pin illustration -->
  <g transform="translate(120, 100)">
    <!-- Google Maps pin -->
    <g filter="url(#glow)">
      <path d="M60 0 C26.9 0 0 26.9 0 60 C0 105 60 180 60 180 C60 180 120 105 120 60 C120 26.9 93.1 0 60 0Z" fill="url(#accent)"/>
      <circle cx="60" cy="55" r="22" fill="#fff"/>
      <text x="60" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#3b82f6">G</text>
    </g>
    
    <!-- 5 stars -->
    <g transform="translate(5, 200)">
      <polygon points="12,0 15,8 24,9 17,15 19,24 12,19 5,24 7,15 0,9 9,8" fill="url(#gold)" filter="url(#glow)"/>
      <polygon points="32,0 35,8 44,9 37,15 39,24 32,19 25,24 27,15 20,9 29,8" fill="url(#gold)" filter="url(#glow)"/>
      <polygon points="52,0 55,8 64,9 57,15 59,24 52,19 45,24 47,15 40,9 49,8" fill="url(#gold)" filter="url(#glow)"/>
      <polygon points="72,0 75,8 84,9 77,15 79,24 72,19 65,24 67,15 60,9 69,8" fill="url(#gold)" filter="url(#glow)"/>
      <polygon points="92,0 95,8 104,9 97,15 99,24 92,19 85,24 87,15 80,9 89,8" fill="url(#gold)" filter="url(#glow)"/>
      <text x="55" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">4.9 (127 reviews)</text>
    </g>

    <!-- Search bar -->
    <g transform="translate(-10, 260)">
      <rect width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="16" r="6" fill="none" stroke="#64748b" stroke-width="2"/>
      <line x1="23" y1="20" x2="28" y2="25" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="21" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">local seo near me</text>
    </g>
  </g>

  <!-- Right side: Content -->
  <g transform="translate(380, 80)">
    <!-- Badge -->
    <rect width="180" height="28" rx="14" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="90" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#60a5fa">LOCAL SEO GUIDE 2026</text>

    <!-- Title -->
    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#f1f5f9" letter-spacing="-0.5">
      <tspan x="0" dy="0">Google Business</tspan>
      <tspan x="0" dy="52">Profile &amp; Local</tspan>
      <tspan x="0" dy="52">SEO: 14 Tips</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="250" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">
      <tspan x="0" dy="0">Prioritised by impact for</tspan>
      <tspan x="0" dy="26">UK businesses</tspan>
    </text>

    <!-- Stats cards -->
    <g transform="translate(0, 310)">
      <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#3b82f6">14</text>
      <text x="65" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Action Items</text>
      
      <g transform="translate(145, 0)">
        <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#f59e0b">4</text>
        <text x="65" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Tier 1 Priority</text>
      </g>
      
      <g transform="translate(290, 0)">
        <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#22c55e">85+</text>
        <text x="65" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Sources Analysed</text>
      </g>
    </g>

    <!-- CTA hint -->
    <g transform="translate(0, 400)">
      <rect width="200" height="40" rx="8" fill="url(#accent)" opacity="0.9"/>
      <text x="100" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#fff">Read the Guide →</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect x="60" y="545" width="1080" height="45" rx="0" ry="0" fill="#0d1320"/>
  <text x="80" y="572" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Iceberg Media</text>
  <text x="1120" y="572" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">updates.icebergmedia.co.uk</text>
</svg>
