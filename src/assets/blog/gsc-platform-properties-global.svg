<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="60" y="40" width="1080" height="550" rx="16" fill="#1e293b"/>
  
  <!-- GSC Logo area -->
  <g transform="translate(100, 80)">
    <circle cx="30" cy="30" r="25" fill="#4285f4" opacity="0.3"/>
    <circle cx="30" cy="30" r="15" fill="#4285f4"/>
    <text x="30" y="35" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#fff">G</text>
    <text x="65" y="38" font-family="system-ui" font-size="16" font-weight="600" fill="#f1f5f9">Search Console</text>
  </g>
  
  <!-- Platform icons -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="100" height="80" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="50" y="35" text-anchor="middle" font-family="system-ui" font-size="24" fill="#e1306c">📸</text>
    <text x="50" y="60" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94a3b8">Instagram</text>
    
    <rect x="120" y="0" width="100" height="80" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="170" y="35" text-anchor="middle" font-family="system-ui" font-size="24" fill="#ff0050">🎵</text>
    <text x="170" y="60" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94a3b8">TikTok</text>
    
    <rect x="240" y="0" width="100" height="80" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="290" y="35" text-anchor="middle" font-family="system-ui" font-size="24" fill="#fff">𝕏</text>
    <text x="290" y="60" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94a3b8">X</text>
    
    <rect x="360" y="0" width="100" height="80" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="410" y="35" text-anchor="middle" font-family="system-ui" font-size="24" fill="#ff0000">▶️</text>
    <text x="410" y="60" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94a3b8">YouTube</text>
  </g>
  
  <!-- Connecting lines -->
  <line x1="250" y1="230" x2="250" y2="270" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
  <text x="250" y="255" text-anchor="middle" font-family="system-ui" font-size="12" fill="#10b981">↓</text>
  
  <!-- Data cards -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="150" height="90" rx="10" fill="#0f172a"/>
    <text x="75" y="30" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748b">CLICKS</text>
    <text x="75" y="60" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="800" fill="#3b82f6">↑</text>
    <text x="75" y="80" text-anchor="middle" font-family="system-ui" font-size="10" fill="#10b981">From Google Search</text>
    
    <rect x="170" y="0" width="150" height="90" rx="10" fill="#0f172a"/>
    <text x="245" y="30" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748b">SEARCH TERMS</text>
    <text x="245" y="55" text-anchor="middle" font-family="system-ui" font-size="14" fill="#f1f5f9">plumber manchester</text>
    <text x="245" y="75" text-anchor="middle" font-family="system-ui" font-size="10" fill="#10b981">Exact queries</text>
    
    <rect x="340" y="0" width="150" height="90" rx="10" fill="#0f172a"/>
    <text x="415" y="30" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748b">IMPRESSIONS</text>
    <text x="415" y="60" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="800" fill="#a855f7">👁</text>
    <text x="415" y="80" text-anchor="middle" font-family="system-ui" font-size="10" fill="#10b981">Search visibility</text>
  </g>
  
  <!-- Main heading -->
  <text x="700" y="180" font-family="system-ui" font-size="36" font-weight="800" fill="#f1f5f9">Platform Properties</text>
  <text x="700" y="230" font-family="system-ui" font-size="36" font-weight="800" fill="#10b981">Now Global</text>
  <text x="700" y="290" font-family="system-ui" font-size="18" fill="#94a3b8">Track how your social content</text>
  <text x="700" y="315" font-family="system-ui" font-size="18" fill="#94a3b8">performs on Google Search</text>
  
  <!-- Launch badge -->
  <rect x="700" y="360" width="120" height="32" rx="16" fill="#10b981" opacity="0.2"/>
  <text x="760" y="382" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#10b981">LIVE NOW</text>
  
  <!-- Footer -->
  <rect x="60" y="545" width="1080" height="45" fill="#0f172a"/>
  <text x="80" y="572" font-family="system-ui" font-size="13" fill="#64748b">Iceberg Media</text>
</svg>
