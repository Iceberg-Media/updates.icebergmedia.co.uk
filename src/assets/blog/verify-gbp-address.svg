<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0f172a"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="60" y="50" font-family="system-ui, sans-serif" font-size="14" fill="#22c55e" font-weight="600">GBP LOCAL SEO TIP #3</text>
  <text x="60" y="100" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="#f1f5f9">Verify Your GBP Address</text>
  <text x="60" y="140" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">No verification = no rankings</text>
  <!-- Verification methods -->
  <rect x="60" y="180" width="350" height="120" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="18" fill="#22c55e" font-weight="700">✓ Postcard</text>
  <text x="80" y="250" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">Google sends a PIN</text>
  <text x="80" y="275" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">to your business address</text>
  <text x="80" y="295" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">5-14 days</text>
  <rect x="430" y="180" width="350" height="120" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="450" y="220" font-family="system-ui, sans-serif" font-size="18" fill="#22c55e" font-weight="700">✓ Phone</text>
  <text x="450" y="250" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">Google calls your business</text>
  <text x="450" y="275" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">with a PIN code</text>
  <text x="450" y="295" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Instant for some</text>
  <rect x="800" y="180" width="350" height="120" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="820" y="220" font-family="system-ui, sans-serif" font-size="18" fill="#22c55e" font-weight="700">✓ Video</text>
  <text x="820" y="250" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">Record your location</text>
  <text x="820" y="275" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">and business signage</text>
  <text x="820" y="295" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">New method</text>
  <!-- Don't do -->
  <rect x="60" y="330" width="520" height="230" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="370" font-family="system-ui, sans-serif" font-size="20" fill="#ef4444" font-weight="700">Don't do this:</text>
  <text x="80" y="410" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">✗ Virtual offices — need physical address</text>
  <text x="80" y="445" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">✗ PO boxes — prohibited by Google</text>
  <text x="80" y="480" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">✗ Hide address for service-area businesses</text>
  <text x="80" y="520" font-family="system-ui, sans-serif" font-size="17" fill="#22c55e">✓ Home address works (can hide from public)</text>
  <!-- Right side -->
  <rect x="620" y="330" width="520" height="230" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="370" font-family="system-ui, sans-serif" font-size="20" fill="#22c55e" font-weight="700">Service-area businesses:</text>
  <text x="640" y="410" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">Still need a verified address</text>
  <text x="640" y="445" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">Can hide from public display</text>
  <text x="640" y="480" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">Google needs to know you exist</text>
  <text x="640" y="515" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">at a real location</text>
</svg>
