<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0f172a"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="60" y="50" font-family="system-ui, sans-serif" font-size="14" fill="#3b82f6" font-weight="600">GBP LOCAL SEO TIP #2</text>
  <text x="60" y="100" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="#f1f5f9">Pick the Right GBP Category</text>
  <text x="60" y="140" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">The single biggest lever most businesses ignore</text>
  <!-- Wrong categories -->
  <rect x="60" y="180" width="500" height="55" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="90" y="215" font-family="system-ui, sans-serif" font-size="22" fill="#ef4444">✗ Handyman</text>
  <text x="500" y="215" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">Too generic, misses plumbing searches</text>
  <!-- Right category -->
  <rect x="60" y="250" width="500" height="55" rx="10" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="2"/>
  <text x="90" y="285" font-family="system-ui, sans-serif" font-size="22" fill="#22c55e">✓ Emergency Plumber</text>
  <text x="500" y="285" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">Specific, matches revenue, ranks better</text>
  <!-- Neutral -->
  <rect x="60" y="320" width="500" height="55" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="90" y="355" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8">  Plumber</text>
  <text x="500" y="355" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">Okay but not optimal</text>
  <!-- How to check -->
  <rect x="620" y="180" width="520" height="370" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="880" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">How to check your category</text>
  <text x="650" y="270" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">1. Search your primary service in your city</text>
  <text x="650" y="310" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">2. Look at the top 3 Map Pack results</text>
  <text x="650" y="350" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">3. What category do they use?</text>
  <text x="650" y="390" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">4. Match your highest revenue service</text>
  <text x="650" y="430" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">5. Use the most specific category</text>
  <text x="650" y="470" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">6. Add secondary categories for other services</text>
  <text x="650" y="510" font-family="system-ui, sans-serif" font-size="17" fill="#94a3b8">7. Check competitor categories on Google Maps</text>
</svg>
