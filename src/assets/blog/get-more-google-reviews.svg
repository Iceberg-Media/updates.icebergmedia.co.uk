  <rect x="620" y="300" width="520" height="250" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="880" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#f59e0b">90</text>
  <text x="880" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#f1f5f9">days</text>
  <text x="880" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">Reviews from the last 90 days</text>
  <text x="880" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">carry the most weight</text>
  <text x="880" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">in Google's ranking algorithm</text>
