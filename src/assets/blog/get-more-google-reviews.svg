  <rect x="60" y="180" width="1080" height="2" fill="#334155"/>
  <!-- MIDDLE: How to get reviews -->
  <text x="60" y="230" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#f1f5f9">How to Get More Google Reviews</text>
  <text x="60" y="265" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">Than every competitor in your area</text>
  <rect x="60" y="300" width="500" height="250" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#22c55e">Quick wins</text>
  <text x="80" y="380" font-family="system-ui, sans-serif" font-size="17" fill="#f1f5f9">1. Ask every customer directly</text>
  <text x="80" y="415" font-family="system-ui, sans-serif" font-size="17" fill="#f1f5f9">2. Send direct review link via text</text>
  <text x="80" y="450" font-family="system-ui, sans-serif" font-size="17" fill="#f1f5f9">3. Ask within 24 hours of service</text>
  <text x="80" y="485" font-family="system-ui, sans-serif" font-size="17" fill="#f1f5f9">4. Respond to every review</text>
  <text x="80" y="520" font-family="system-ui, sans-serif" font-size="17" fill="#f1f5f9">5. Use QR codes on invoices</text>
